<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D Basic Cooling System | Automotive Training Lab</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d1623;color:#edf5ff;font-family:system-ui,Segoe UI,sans-serif}body{display:flex;flex-direction:column}header{display:flex;align-items:center;gap:18px;min-height:54px;padding:10px 18px;border-bottom:1px solid #31465a}header strong{font-size:17px}header a{color:#9fd7f4;text-decoration:none;font-size:14px}button{margin-left:auto;border:1px solid #3a566d;border-radius:6px;background:#1a2c40;color:#edf5ff;padding:7px 12px;font:inherit;font-size:13px}button:disabled{opacity:.4}main{flex:1;position:relative;min-height:0}canvas{display:block;width:100%;height:100%;outline:none;background:#0d1623}#loading{position:absolute;inset:0;display:grid;place-content:center;gap:14px;text-align:center;background:#0d1623}progress{width:260px;height:12px;accent-color:#2697ca}#error{max-width:550px;padding:20px;color:#ffb8a5}@media(max-width:600px){header{gap:10px;padding:8px 10px}header strong{font-size:14px}header a{font-size:12px}}
</style>
</head>
<body>
<header><a href="../">← Lessons</a><strong>3D Basic Cooling System</strong><button id="fullscreen" type="button" disabled>Full screen</button></header>
<main><canvas id="unity-canvas" tabindex="0" aria-label="Interactive 3D cooling system lesson"></canvas><div id="loading"><strong>Loading cooling system…</strong><progress id="progress" max="1" value="0"></progress><div id="error" role="alert" hidden></div></div></main>
<script>
const canvas=document.getElementById('unity-canvas'),loading=document.getElementById('loading'),error=document.getElementById('error'),fullscreen=document.getElementById('fullscreen');
const buildUrl='Build';
const config={dataUrl:buildUrl+'/3d-basic-cooling-system.data',frameworkUrl:buildUrl+'/3d-basic-cooling-system.framework.js',streamingAssetsUrl:'StreamingAssets',companyName:"DefaultCompany",productName:"3D Basic Cooling System",productVersion:"1.0",matchWebGLToCanvasSize:true,devicePixelRatio:Math.min(window.devicePixelRatio||1,1.5)};
function failed(message){document.getElementById('progress').hidden=true;error.hidden=false;error.textContent='The lesson could not start. Please refresh the page or try a current desktop browser.';console.error(message);}
const loader=document.createElement('script');loader.src=buildUrl+'/3d-basic-cooling-system.loader.js';
async function startLesson(){
  // Reassemble the exact Unity runtime from two files to keep each repository upload small.
  const parts=await Promise.all([1,2].map(async part=>{
    const response=await fetch(buildUrl+'/3d-basic-cooling-system.wasm.part'+part);
    if(!response.ok)throw new Error('Runtime download failed: '+response.status);
    return response.arrayBuffer();
  }));
  const runtimeUrl=URL.createObjectURL(new Blob(parts,{type:'application/wasm'}));
  try{
    config.codeUrl=runtimeUrl;
    const instance=await createUnityInstance(canvas,config,p=>document.getElementById('progress').value=p);
    loading.hidden=true;loading.style.display='none';fullscreen.disabled=false;
    fullscreen.onclick=()=>instance.SetFullscreen(1);canvas.focus();
  }finally{URL.revokeObjectURL(runtimeUrl);}
}
loader.onload=()=>startLesson().catch(failed);
loader.onerror=()=>failed('Unity loader could not be downloaded.');document.body.appendChild(loader);
</script>
</body></html>
