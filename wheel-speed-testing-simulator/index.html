<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wheel Speed Testing Simulator</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark;--bg:#0d151d;--panel:#16232e;--edge:#344856;--ink:#eef5f8;--muted:#b4c7d2;--cyan:#61e6ca;--red:#ff9b9b}
body{margin:0;background:var(--bg);color:var(--ink);font:16px system-ui,sans-serif}
main{max-width:1080px;margin:auto;padding:24px}
h1{font-size:clamp(25px,4vw,38px);margin:0 0 16px} h2{font-size:18px;margin:0 0 10px}
p{line-height:1.45;margin:8px 0;color:var(--muted)}
nav,.controls,.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,select{font:inherit;background:#233644;color:var(--ink);border:1px solid #526879;border-radius:7px;padding:7px 10px}
button{cursor:pointer}button[aria-pressed=true]{background:var(--cyan);color:#0e2926;border-color:var(--cyan)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #ffd086;outline-offset:3px}
input[type=range]{accent-color:var(--cyan);width:min(30vw,230px)}
.panel{margin-top:12px;background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:14px;min-width:0}
.bench{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:12px}
canvas{background:#0b1821;display:block;width:100%;border-radius:7px}
#trace{height:175px;margin-top:8px}#ring{height:245px}
.small{font-size:13px}
#pins{display:flex;gap:7px;flex-wrap:wrap;margin:9px 0}
.pin{flex:1;min-width:84px;font-size:13px;text-align:left}
.pin strong{display:block;margin-bottom:3px}.probeR{color:var(--red)}.probeB{color:#e6edf5}
.meter{border:2px solid #a88642;background:#282d30;border-radius:11px;padding:10px;margin-top:12px}.display{background:#caddb8;color:#1f301e;border-radius:6px;padding:7px 12px;font:bold clamp(20px,4vw,32px) monospace;display:block;text-align:right;margin-bottom:8px}
.selectors{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.selectors label{flex:1;min-width:130px}.selectors select{width:100%;margin-top:3px;font-size:14px}
[hidden]{display:none!important}
@media(max-width:700px){main{padding:12px}.bench{grid-template-columns:1fr;gap:0}}
</style>
</head>
<body>
<main>
<h1>Wheel Speed Testing Simulator</h1>
<nav aria-label="Sensor type">
<button type="button" data-sensor="hall" aria-pressed="true">3-wire Hall effect</button>
<button type="button" data-sensor="passive" aria-pressed="false">2-wire passive</button>
<button type="button" data-sensor="active" aria-pressed="false">2-wire magnetoresistive</button>
</nav>

<section class="panel" aria-labelledby="scopeTitle">
<h2 id="scopeTitle">Reference oscilloscope</h2>
<div class="controls">
<label for="speed">Wheel speed</label><input type="range" id="speed" min="0" max="120" step="0.1" value="15">
<output id="speedValue" for="speed"></output>
<button type="button" id="stop">Stop wheel</button>
<button type="button" id="pauseScope" aria-controls="trace scopeNote">Pause waveform</button>
<label>Time window <select id="window"><option value="100">100 ms</option><option value="200" selected>200 ms</option><option value="500">500 ms</option><option value="1000">1 second</option></select></label>
</div>
<canvas id="trace" role="img" aria-label="Sensor reference oscilloscope trace"></canvas>
<p id="scopeNote" class="small"></p>
</section>

<div class="bench">
<section class="panel">
<h2 id="ringTitle">Magnetic encoder ring</h2>
<canvas id="ring" role="img" aria-label="Rotating wheel encoder and stationary sensor"></canvas>
<p id="ringNote" class="small"></p>
<label>Sensor fault <select id="fault"></select></label>
<label id="missingControl" hidden> Teeth missing <select id="missingCount"><option>1</option><option>2</option><option>3</option></select></label>
<label id="resistanceControl" hidden> Added signal resistance <input id="faultResistance" type="range" min="100" max="4000" step="100" value="1500"> <output id="faultOhms" for="faultResistance"></output></label>
<p id="faultNote" class="small"></p>
<h2>Guided tests</h2>
<div id="tests" class="actions"></div>
<p id="testNote" class="small" aria-live="polite"></p>
</section>

<section class="panel">
<h2>Sensor connector</h2>
<div class="actions">
<label>Connection <select id="connection"><option value="connected">Connected / backprobe</option><option value="sensor">Unplugged / sensor side</option><option value="harness">Unplugged / harness side</option></select></label>
<label id="powerLabel"><input id="power" type="checkbox" checked> Module power</label>
</div>
<div id="pins" aria-label="Connector pins"></div>

<div class="meter">
<h2>Digital multimeter</h2>
<output id="reading" class="display" aria-label="Multimeter reading"></output>
<div class="actions">
<label>Mode <select id="mode"><option value="dc">DC voltage</option><option value="ac">AC voltage</option><option value="ohms">Resistance</option><option value="amps">DC milliamps</option></select></label>
</div>
<div class="selectors">
<label class="probeR">Red probe <select id="red"></select></label>
<label class="probeB">Black probe (COM) <select id="black"></select></label>
</div>
<p id="meterComparison" class="small" hidden></p>
<p id="meterNote" class="small" aria-live="polite"></p>
</div>
</section>
</div>
</main>
<script>
'use strict';
const el = id => document.getElementById(id);
const sensors = {
  hall: {
    pins: ['5 V supply', 'Signal', 'Sensor ground'],
    probes: [1, 2], mode: 'dc', connection: 'connected',
    title: 'Magnetic encoder ring',
    note: 'Alternating magnetic poles switch the powered Hall sensor between 0 and 5 V. A DC meter averages the pulses as the wheel turns.',
    trace: 'Signal relative to sensor ground', range: [0, 5]
  },
  passive: {
    pins: ['Coil terminal 1', 'Coil terminal 2'],
    probes: [0, 1], mode: 'ac', connection: 'sensor',
    title: 'Toothed steel tone ring',
    note: 'Steel teeth change the magnetic flux through the pickup coil. Faster rotation increases both AC voltage and frequency.',
    trace: 'AC voltage across the pickup coil', range: [-10, 10]
  },
  active: {
    pins: ['12 V supply', 'Signal return'],
    probes: [1, 2], mode: 'dc', connection: 'connected',
    title: 'Magnetic encoder ring',
    note: 'The magnetoresistive sensor switches loop current between 7 and 14 mA. A 100 Ω resistor in the simulated ABS module converts that current to 0.7–1.4 V on the signal return.',
    trace: 'Signal return relative to module ground', range: [0, 2]
  }
};
let kind = 'hall';
let probeToPlace = 'red';
let rotation = 0;
let lastFrame;
let lastTrace;
let frozenTrace;
const teeth = 24;
const tau = Math.PI * 2;
const rpm = speed => speed / 3.6 / 2 * 60;
const frequency = speed => rpm(speed) * teeth / 60;
const passivePeak = speed => 0.30 * Math.SQRT2 * rpm(speed) / 30;
const guided = {
  hall: [
    ['Check supply', 'connected', 'dc', 0, 2, 0, 'With module power on, backprobe supply to sensor ground. Expect 5.00 V DC in this example.'],
    ['Check signal', 'connected', 'dc', 1, 2, 7.2, 'Backprobe signal to sensor ground. Expect about 2.50 V DC at steady speed and a 0–5 V waveform. Stop the wheel to see one fixed logic level.']
  ],
  passive: [
    ['Measure coil resistance', 'sensor', 'ohms', 0, 1, 0, 'Stop the wheel. Unplug the sensor and measure across its two terminals. The simulated 950 Ω falls within the ZF/WABCO example range of 900–2,000 Ω.'],
    ['Check AC at 30 rpm', 'sensor', 'ac', 0, 1, 3.6, 'Across both sensor-side terminals, turn the wheel at half a revolution per second. Expect 0.30 V AC in the lab. The ZF/WABCO example specifies at least 0.20 V AC. Use a meter rated for the signal frequency or confirm with a scope.']
  ],
  active: [
    ['Check supply', 'harness', 'dc', 0, 2, 0, 'With the sensor unplugged and module power on, check supply to module ground. Expect 12.00 V DC in the lab. Confirm the vehicle procedure before testing.'],
    ['Check signal return', 'connected', 'dc', 1, 2, 7.2, 'Reconnect and backprobe the return to module ground. Expect about 1.05 V DC and 0.70–1.40 V switching on the scope. A suitable low-current clamp around one wire can verify loop current without opening the circuit.']
  ]
};

const faultOptions = {
  normal: ['No fault', ''],
  gap: ['Excessive air gap', 'A wider gap weakens the signal. The passive coil can still pass its resistance test. On active sensors, weak sectors can lose pulses.'],
  missing: ['Missing teeth on steel ring', 'Look for a weak section once per revolution. The AC meter averages the defect, so the scope is better for locating it.'],
  ring: ['Damaged magnetic encoder', 'Two pulses are suppressed at the same spot each revolution. Supply voltage can still be normal.'],
  corrosion: ['Corroded signal wire / connector', 'Added resistance prevents the Hall output from pulling the module’s signal fully low. This example uses a 1 kΩ pull-up at the module.']
};
const faultsBySensor = {
  hall: ['normal', 'ring', 'corrosion', 'gap'],
  passive: ['normal', 'gap', 'missing'],
  active: ['normal', 'ring', 'gap']
};

function faultSettings() {
  return {
    fault: el('fault').value,
    missing: Number(el('missingCount').value),
    resistance: Number(el('faultResistance').value)
  };
}

function updateFaultControls() {
  const {fault, resistance} = faultSettings();
  el('missingControl').hidden = fault !== 'missing';
  el('resistanceControl').hidden = fault !== 'corrosion';
  el('faultOhms').textContent = resistance + ' Ω';
  el('faultNote').textContent = faultOptions[fault][1];
}

function weakSector(cycle, fault) {
  return fault === 'ring' && cycle >= 8 && cycle < 10 ||
    fault === 'gap' && (cycle >= 7 && cycle < 11 || cycle >= 18 && cycle < 20);
}

function hallLow(settings) {
  return settings.fault === 'corrosion' ? 5 * settings.resistance / (1000 + settings.resistance) : 0;
}

function pickupGain(cycle, settings) {
  if (settings.fault === 'gap') return 0.24;
  if (settings.fault === 'missing' && cycle >= 8 && cycle < 8 + settings.missing) return 0.05;
  return 1;
}

function pickupRms(speed, settings) {
  const missing = settings.fault === 'missing' ? settings.missing : 0;
  const meanSquareGain = missing ? (teeth - missing + missing * 0.05 ** 2) / teeth : pickupGain(0, settings) ** 2;
  return passivePeak(speed) * Math.sqrt(meanSquareGain / 2);
}

function circuit(type, speed, power, connection, mode, red, black, phase, settings) {
  const sensor = sensors[type];
  const moving = speed > 0;
  const passive = type === 'passive';
  const on = !passive && power && connection !== 'sensor';
  const powered = on && connection === 'connected';
  const shown = (value, unit) => value.toFixed(unit === 'Ω' ? 0 : 2) + ' ' + unit;
  const result = (display, note) => ({display, note, powered});
  const dropped = settings.fault === 'ring' ? 2 : settings.fault === 'gap' ? 6 : 0;
  const duty = moving ? (teeth - dropped) / (2 * teeth) : 0;
  const low = type === 'hall' ? hallLow(settings) : 0.7;
  const span = (type === 'hall' ? 5 : 1.4) - low;
  if (red < 0 || black < 0) {
    return mode === 'ohms' ? result('O.L', 'Open circuit. Connect both probes.') :
      result('—', 'Connect both probes.');
  }
  if (mode === 'amps') {
    if (red === black) return result('0.00 mA', 'Both leads are on the same point.');
    return result('CHECK LEADS', 'Current mode requires an in-series connection. Probing across powered pins can short the circuit.');
  }
  if (mode === 'ohms') {
    if (on || passive && moving && connection !== 'harness') {
      return result('LIVE CIRCUIT', 'Switch off module power or stop the wheel before measuring resistance.');
    }
    if (!passive && connection !== 'harness') {
      return result('USE VOLTS', 'Use the powered signal test. Pico advises against resistance testing active wheel speed sensors.');
    }
    if (red === black) return result('0 Ω', 'Both probes are on the same terminal.');
    if (passive && connection !== 'harness') {
      return result('950 Ω', connection === 'sensor' ?
        'Coil resistance measured across the isolated sensor.' :
        'The coil is still in the circuit. Unplug the connector to verify its resistance in isolation.');
    }
    return result('O.L', passive ? 'Open circuit. The pickup coil is disconnected from these pins.' :
      'No continuity is modeled between these points. Use the powered signal test to evaluate the active sensor.');
  }
  if (red === black) return result(shown(0, 'V'), 'Both leads are on the same point.');
  if (passive) {
    if (connection === 'harness') return result(shown(0, 'V'), 'The pickup coil is disconnected from these harness pins.');
    return result(shown(mode === 'ac' ? pickupRms(speed, settings) : 0, 'V'),
      mode === 'ac' ? 'AC RMS across the coil. This example is ' + frequency(speed).toFixed(1) + ' Hz. Check your meter’s AC bandwidth at low speed.' : 'The positive and negative half-cycles average to 0 V DC. Use AC voltage.');
  }
  const ref = sensor.pins.length;
  if (connection === 'sensor' && (red === ref || black === ref)) return result('—', 'The unplugged sensor has no connection to module ground.');
  if (connection === 'sensor') return result('—', 'This active sensor is unplugged and has no supply or ground reference.');
  if (mode === 'ac') {
    const rms = powered && moving && (red === 1 || black === 1) ? span * Math.sqrt(duty * (1 - duty)) : 0;
    return result(shown(rms, 'V'), rms ?
      'AC RMS of the pulse component only. Use DC voltage for the supply and the scope to verify pulse levels.' :
      'No changing voltage is present across these points. Use DC mode to check the steady voltage.');
  }
  if (type === 'active' && (red === 1 || black === 1) && !powered) {
    return result(on && (red === 0 || black === 0) ? shown(red === 0 ? 12 : -12, 'V') : shown(0, 'V'),
      'The module return has no sensor current. Check power and connector position.');
  }
  const hallSignal = moving ? low + span * duty : phase;
  const dc = type === 'hall'
    ? [on ? 5 : 0, powered ? hallSignal : on ? 5 : 0, 0, 0, 0]
    : [on ? 12 : 0, powered ? low + span * duty : 0, 0, 0];
  return result(shown(dc[red] - dc[black], 'V'),
    !powered ? 'The sensor is unpowered or disconnected. Check the supply and connector.' :
    'DC voltage is measured red minus black. A moving digital signal reads as an average.');
}

function configurePins(reset) {
  const sensor = sensors[kind];
  const points = sensor.pins.map((label, index) => [index, 'Pin ' + (index + 1), label]);
  if (kind !== 'passive') points.push([sensor.pins.length, 'Module ground', 'Reference']);
  for (const lead of ['red', 'black']) {
    const select = el(lead);
    const previous = reset ? sensor.probes[lead === 'red' ? 0 : 1] : Number(select.value);
    select.replaceChildren(new Option('Disconnected', '-1'),
      ...points.map(([value, name, label]) => new Option(name + ' — ' + label, value)));
    select.value = points.some(([value]) => value === previous) ? previous : -1;
  }
  el('pins').replaceChildren(...points.map(([value, name, label]) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'pin';
    button.dataset.pin = value;
    const title = document.createElement('strong');
    title.textContent = name;
    const leads = document.createElement('span');
    leads.className = 'pinLeads';
    button.append(title, document.createTextNode(label + ' '), leads);
    button.addEventListener('click', () => {
      el(probeToPlace).value = value;
      probeToPlace = probeToPlace === 'red' ? 'black' : 'red';
      update();
    });
    return button;
  }));
}

function update() {
  for (const button of el('pins').children) {
    const red = button.dataset.pin === el('red').value;
    const black = button.dataset.pin === el('black').value;
    const leads = button.querySelector('.pinLeads');
    leads.className = 'pinLeads ' + (red ? 'probeR' : 'probeB');
    leads.textContent = red && black ? '● RED + COM' : red ? '● RED' : black ? '● COM' : '';
  }
}
function choose(type) {
  kind = type;
  el('fault').replaceChildren(...faultsBySensor[type].map(fault => new Option(faultOptions[fault][0], fault)));
  updateFaultControls();
  const sensor = sensors[type];
  for (const button of document.querySelectorAll('[data-sensor]')) {
    button.setAttribute('aria-pressed', String(button.dataset.sensor === type));
  }
  el('ringTitle').textContent = sensor.title;
  el('ringNote').textContent = sensor.note;
  el('mode').value = sensor.mode;
  el('connection').value = sensor.connection;
  el('powerLabel').hidden = type === 'passive';
  probeToPlace = 'red';
  configurePins(true);
  update();
  el('testNote').textContent = '';
  el('tests').replaceChildren(...guided[type].map(([label, connection, mode, red, black, speed, note]) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = label;
    button.addEventListener('click', () => {
      el('connection').value = connection;
      el('mode').value = mode;
      el('power').checked = type !== 'passive';
      el('speed').value = speed;
      el('window').value = type === 'passive' ? '500' : '200';
      configurePins(false);
      el('red').value = red;
      el('black').value = black;
      el('testNote').textContent = note + ' Expected readings are for a known-good sensor.';
      update();
    });
    return button;
  }));
}
for (const button of document.querySelectorAll('[data-sensor]')) {
  button.addEventListener('click', () => choose(button.dataset.sensor));
}
el('connection').addEventListener('change', () => { configurePins(false); update(); });
for (const lead of ['red', 'black']) el(lead).addEventListener('change', update);
for (const id of ['fault', 'missingCount', 'faultResistance']) {
  el(id).addEventListener('input', updateFaultControls);
}
el('stop').addEventListener('click', () => { el('speed').value = 0; });
el('pauseScope').addEventListener('click', () => {
  if (!lastTrace) return;
  frozenTrace = frozenTrace ? undefined : lastTrace;
  el('pauseScope').textContent = frozenTrace ? 'Resume waveform' : 'Pause waveform';
});

function surface(id) {
  const canvas = el(id);
  const w = canvas.clientWidth, h = canvas.clientHeight;
  const dpr = devicePixelRatio || 1;
  if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  return {ctx, w, h};
}

function drawRing(powered, settings) {
  const {ctx, w, h} = surface('ring');
  const x = w * 0.38, y = h * 0.51, radius = Math.min(w * 0.24, h * 0.34);
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(-rotation);
  ctx.fillStyle = '#233743';
  ctx.beginPath();
  ctx.arc(0, 0, radius, 0, tau);
  ctx.fill();
  const steel = kind === 'passive';
  const count = steel ? teeth : 2 * teeth;
  for (let i = 0; i < count; i++) {
    const markedPole = !steel && weakSector(i / 2, settings.fault);
    ctx.fillStyle = steel ? '#acbbc4' : markedPole ? '#607280' : i % 2 ? '#56a6de' : '#ec7777';
    if (steel) {
      if (pickupGain(i, settings) !== 0.05) ctx.fillRect(radius - 3, -radius * 0.068, 11, radius * 0.136);
    } else {
      ctx.beginPath();
      ctx.arc(0, 0, radius + 4, 0, tau / count - 0.015);
      ctx.arc(0, 0, radius - 11, tau / count - 0.015, 0, true);
      ctx.fill();
    }
    ctx.rotate(tau / count);
  }
  ctx.restore();
  ctx.fillStyle = '#09141c';
  ctx.beginPath();
  ctx.arc(x, y, radius * 0.31, 0, tau);
  ctx.fill();
  const tip = x + radius + (settings.fault === 'gap' ? 28 : 15);
  ctx.fillStyle = powered || steel ? '#61e6ca' : '#607280';
  ctx.fillRect(tip, y - 9, 12, 18);
  ctx.fillStyle = '#557183';
  ctx.fillRect(tip + 12, y - 16, 36, 32);
  ctx.fillStyle = '#dcebf1';
  ctx.font = '12px system-ui';
  ctx.textAlign = 'center';
  ctx.fillText('Sensor', Math.min(w - 27, tip + 30), y - 24);
  ctx.fillText(steel ? 'Steel teeth' : 'Alternating north / south poles', x, h - 15);
}

function drawTrace({type, speed, powered, phase, rotation, ms, settings, connection}) {
  const {ctx, w, h} = surface('trace');
  const {trace} = sensors[type];
  const limit = Math.max(0.5, Math.ceil(passivePeak(speed) * 2) / 2);
  const range = type === 'passive' ? [-limit, limit] : sensors[type].range;
  const hz = frequency(speed);
  const left = 40, top = 10, width = w - left - 14, height = h - top - 27;
  const padding = (range[1] - range[0]) * 0.12;
  const y = v => top + (range[1] + padding - v) / (range[1] - range[0] + 2 * padding) * height;
  ctx.font = '11px system-ui';
  ctx.fillStyle = '#b4c7d2';
  ctx.strokeStyle = '#314858';
  for (const v of [range[0], (range[0] + range[1]) / 2, range[1]]) {
    ctx.beginPath(); ctx.moveTo(left, y(v)); ctx.lineTo(left + width, y(v)); ctx.stroke();
    ctx.fillText(v + ' V', 4, y(v) + 4);
  }
  for (let i = 0; i <= 4; i++) {
    const x = left + width * i / 4;
    ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(x, top + height); ctx.stroke();
    ctx.fillText(ms * i / 4, x - 8, h - 5);
  }
  ctx.strokeStyle = '#61e6ca';
  ctx.lineWidth = 2;
  ctx.beginPath();
  const samples = Math.max(Math.ceil(width * 2), Math.ceil(hz * ms / 1000 * 30));
  for (let i = 0; i <= samples; i++) {
    const turns = (i / samples - 1) * hz * ms / 1000 + rotation * teeth / tau;
    const cycle = (turns % teeth + teeth) % teeth;
    const high = cycle % 1 < 0.5 && !weakSector(cycle, settings.fault);
    let v = 0;
    if (type === 'passive' && connection !== 'harness') {
      v = passivePeak(speed) * pickupGain(cycle, settings) * Math.sin(turns * tau);
    } else if (powered) {
      v = type === 'active' ? speed && high ? 1.4 : 0.7 :
        speed ? high ? 5 : hallLow(settings) : phase;
    }
    const x = left + width * i / samples;
    if (i === 0) ctx.moveTo(x, y(v)); else ctx.lineTo(x, y(v));
  }
  ctx.stroke();
  return trace + ' · ' + hz.toFixed(1) + ' Hz wheel frequency · horizontal scale in ms';
}

function frame(now) {
  const speed = Number(el('speed').value);
  const dt = Math.min(0.05, (now - (lastFrame ?? now)) / 1000);
  lastFrame = now;
  rotation = (rotation + speed * dt * 0.09) % tau;
  const settings = faultSettings();
  const cycle = rotation * teeth / tau % teeth;
  const phase = cycle % 1 < 0.5 && !weakSector(cycle, settings.fault) ? 5 : hallLow(settings);
  const power = el('power').checked;
  const connection = el('connection').value;
  const mode = el('mode').value;
  const red = Number(el('red').value), black = Number(el('black').value);
  const result = circuit(kind, speed, power, connection, mode, red, black, phase, settings);
  const showComparison = settings.fault !== 'normal' && /^[+-]?\d/.test(result.display);
  el('meterComparison').hidden = !showComparison;
  let comparison = '';
  if (showComparison) {
    const healthyPhase = cycle % 1 < 0.5 ? 5 : 0;
    const healthy = circuit(kind, speed, power, connection, mode, red, black, healthyPhase, {fault: 'normal'});
    comparison = 'Known-good reading with this setup: ' + healthy.display +
      (healthy.display === result.display ? ' · Same displayed reading' : '');
  }
  lastTrace = {type: kind, speed, powered: result.powered, phase, rotation, ms: Number(el('window').value), settings, connection};
  const status = drawTrace(frozenTrace ?? lastTrace);
  const scopeStatus = frozenTrace ? 'Paused · ' + status : status;
  for (const [id, value] of [['speedValue', speed + ' km/h · ' + rpm(speed).toFixed(0) + ' rpm'], ['scopeNote', scopeStatus],
    ['reading', result.display], ['meterComparison', comparison], ['meterNote', result.note]]) {
    if (el(id).textContent !== value) el(id).textContent = value;
  }
  drawRing(result.powered, settings);
  requestAnimationFrame(frame);
}
choose('hall');
requestAnimationFrame(frame);
</script>
</body>
</html>
